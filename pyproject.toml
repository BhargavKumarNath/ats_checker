[project]
name = "atsc"
version = "0.1.0"
description = "ATS resume checker for ML/DS/AI roles: free deterministic scoring + paid RAG-grounded deep report."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0.3",
    "numpy>=2.5.3",
    "fastembed>=0.8.0",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "spacy>=3.8.16",
    "en-core-web-sm",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=0.1",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
    "types-pyyaml>=6.0.12.20260906",
    "reportlab>=5.0.1",
    "pillow>=12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atsc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:atsc.*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Text-processing code legitimately contains bullet glyphs, dash variants and mojibake tables.
"src/atsc/core/parsing/*" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/atsc"]

[[tool.mypy.overrides]]
module = ["atsc.core.*"]
strict = true

# ---------------------------------------------------------------------------
# Cost boundary, guard 1 (technical_architecture.md §6; CLAUDE.md non-negotiable 1).
# Nothing reachable from a free-tier request may import a metered client.
# `anthropic` and the Layer 2 generation/worker packages are the only places a
# metered call can originate; core, free and web are forbidden from importing them.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["atsc"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Free path never reaches a metered API"
type = "forbidden"
source_modules = ["atsc.core", "atsc.free", "atsc.web"]
forbidden_modules = ["anthropic", "atsc.deep.generation", "atsc.deep.worker"]

[[tool.importlinter.contracts]]
name = "Core foundation does not depend on either layer"
type = "forbidden"
source_modules = ["atsc.core"]
forbidden_modules = ["atsc.free", "atsc.deep", "atsc.web"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
