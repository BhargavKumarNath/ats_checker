      Method, precision, cost result and the accuracy guard that proves it was done responsibly.
  - cluster_id: quantization
    text: >-
      Applied GPTQ and structured pruning to an on-device speech model, shrinking it from 480 MB to 95 MB with no measurable change in word error rate.
